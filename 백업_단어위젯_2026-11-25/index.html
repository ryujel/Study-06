<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>글자 그림 짝짓기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위 줄에 그림 4개, 아래 줄에 작은 글자 4개. 맞으면 그림이 글자 바로 위(좁은 간격)로 붙는다 */
:root {
  --bg: #eef2f4;
  --card: #ffffff;
  --fg: #1c2a33;
  --muted: #5d6f7a;
  --line: #cfd9de;
  --hit: #e11d48;   /* 검색어와 정확히 같은 단어 강조(빨강) */
  --accent: #e8553d;
  --accent-ink: #ffffff;
  --teal: #167d7f;
  --ok: #1f9d55;
  --bad: #d63b3b;
  --tray: #dfe8ec;
  --display: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;   /* 둥근 글꼴(Jua) 대신 각이 선 고딕 */
  --body: "IBM Plex Sans KR", "Noto Sans KR", system-ui, -apple-system, sans-serif;   /* ㅐ/ㅔ·ㅗ/ㅜ처럼 비슷한 글자가 또렷하게 구분되는 고딕 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181c; --card: #1d262c; --fg: #eaf1f4; --muted: #9db0ba; --line: #5a7482;
    --accent: #ff7a63; --accent-ink: #1a0f0c; --teal: #4cc2c4; --ok: #4cd08a; --bad: #ff6b6b;
    --tray: #243038; --hit: #ff5a5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181c; --card: #1d262c; --fg: #eaf1f4; --muted: #9db0ba; --line: #5a7482;
  --accent: #ff7a63; --accent-ink: #1a0f0c; --teal: #4cc2c4; --ok: #4cd08a; --bad: #ff6b6b;
  --tray: #243038; --hit: #ff5a5a; color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--body); font-size: 16px; margin: 0;
  padding-inline: 16px; padding-block: 16px 32px;
}
.app { max-width: none; min-width: 340px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; margin: 0; }
.status { margin: 0; font-weight: 700; color: var(--muted); min-height: 1.5em; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }

.pics, .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pics { background: var(--tray); padding: 10px 8px; border-radius: 18px; }
.pics { font-size: 1rem; } .pic { font-size: clamp(2rem, 9vw, 3.2rem); }
.col { min-height: 40px; justify-content: center; }
.cell { aspect-ratio: 1; display: grid; place-items: center; }
.pic {
  position: relative; width: 100%; height: 100%; border-radius: 16px; background: var(--card);
  border: 2px solid var(--line); display: grid; place-items: center; font-size: clamp(2.4rem, 12vw, 3.8rem);
  line-height: 1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.pic.dragging { opacity: .25; }
.pic.done { cursor: default; border-color: var(--ok); touch-action: pan-y; } /* 맞힌 그림 위에서는 화면 스크롤 가능 */
/* 태블릿처럼 넓은 화면에서는 6열로 줄여 한 화면에 더 많이 보이게 */
@media (min-width: 560px) { .pics, .board { grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); } }
.app.hosted { max-width: none; }   /* 위젯에서도 정답보기와 게임 화면이 같은 폭·같은 그림 크기: 창 폭에 비례해 커진다(세로는 스크롤) */
.ghost {
  position: fixed; z-index: 50; pointer-events: none; width: 88px; height: 88px; border-radius: 16px;
  background: var(--card); border: 2px solid var(--teal); display: grid; place-items: center; font-size: 3rem;
  box-shadow: 0 10px 24px rgba(0,0,0,.28); transform: translate(-50%, -50%) scale(1.1);
}

.board { margin-top: -6px; row-gap: 2px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 0; padding-bottom: 6px; border-radius: 14px; transition: background .15s; }
.col.over { background: color-mix(in srgb, var(--teal) 16%, transparent); }
.pic .o { inset: 3px; }
.cell { position: relative; }
.cell .ox { position: absolute; left: 9px; top: 5px; z-index: 4; pointer-events: none; font-size: .64rem; line-height: 1; font-weight: 700; letter-spacing: .02em; white-space: pre; color: var(--muted); text-shadow: 0 1px 2px rgba(0, 0, 0, .85); }
.cell .ox i { font-style: normal; }
.cell .ox i.ox-o { color: var(--ok); }
.cell .ox i.ox-x { color: var(--bad); }
.cell .eyem { position: absolute; right: 7px; top: 5px; z-index: 5; width: 22px; height: 22px; border-radius: 50%; background: var(--bad); color: #fff; font-size: .72rem; line-height: 22px; text-align: center; pointer-events: none; box-shadow: 0 0 0 2px #fff; }
.sbar #bEye.over { background: var(--bad); color: #fff; border-color: var(--bad); transform: scale(1.25); }
.app.answers .cell .ox { display: none; }
.app.hideox .cell .ox { display: none; }   /* 정답보기 목록에는 넣지 않는다 */
.word { position: relative; font-weight: 600; font-family: var(--display); font-size: 1.2rem; line-height: 1; padding: 0 2px; margin-top: 0; color: var(--fg); white-space: nowrap; }
.col.done .word { color: var(--ok); }

.x {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--bad); font-weight: 900;
  font-size: 2.4rem; line-height: 1; pointer-events: none; text-shadow: 0 0 0 var(--bad);
  animation: shake .4s;
}
.word .x { font-size: 1.6rem; }
.o { position: absolute; inset: -8px -8px -2px -8px; border: 4px solid var(--ok); border-radius: 50%; pointer-events: none; }
.ghost.landing { background: transparent; border-color: transparent; box-shadow: none; }
.pic .x { background: color-mix(in srgb, var(--card) 55%, transparent); border-radius: 14px; font-size: 3.4rem; }

.speak { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--tray); padding: 12px; border-radius: 18px; }
.mic { font: inherit; font-weight: 700; font-size: 1.05rem; min-height: 56px; padding: 0 26px; border-radius: 28px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
.mic.listening { background: var(--bad); color: #fff; animation: pulse 1s infinite; }
.mic svg { width: 22px; height: 22px; fill: currentColor; }
.type-row { display: flex; gap: 8px; width: 100%; }
.type-row input { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--fg); min-height: 46px; }
.type-row button { font: inherit; font-weight: 700; padding: 0 18px; border-radius: 12px; border: 0; background: var(--teal); color: var(--bg); cursor: pointer; min-height: 46px; }
.type-row input:focus-visible, .type-row button:focus-visible, .mic:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.board.quiz .col:not(.done) .word { visibility: hidden; }
.listen { display: flex; gap: 8px; flex-wrap: wrap; }
.listen .btn { min-height: 42px; padding: 0 6px; font-size: .8rem; white-space: nowrap; }
.listen { gap: 6px; }
.listen { align-items: center; }
.modes { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
.modes .mode { flex: 1 1 0; min-width: 0; min-height: 34px; padding: 0 1px; font-size: .72rem; border-width: 1px; border-radius: 10px; white-space: nowrap; overflow: hidden; }
.modes .mode.on { background: var(--teal); color: var(--bg); border-color: var(--teal); }
.modes .tr-toggle { flex: 0 0 auto; min-height: 34px; padding: 0 6px; font-size: .72rem; white-space: nowrap; border-width: 1px; border-radius: 10px; }
.modes .tr-toggle[hidden] { display: none; }
.pager .btn { min-height: 30px; padding: 0 7px; font-size: .72rem; border-width: 1px; border-radius: 10px; }
.modes .tr-toggle.on { background: var(--teal); color: var(--bg); border-color: var(--teal); }
.modes .srow { flex: 1 1 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 2px; }
.modes .status { flex: 1 1 auto; margin: 0; font-size: 1.05rem; min-height: 0; }
.status:empty { display: none; }
.vol { display:none; height:10px; margin:2px 0 6px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
.app[data-mode="read"] .vol { display:block; }
.vol i { display:block; height:100%; width:0; background:var(--ok); transition:width .08s; }
.sright { font-weight: 800; font-size: 1.05rem; white-space: nowrap; margin-left: auto; }
.sright.ok { color: var(--ok); } .sright.bad { color: var(--bad); }
.app[data-mode="listen"] .board, .app[data-mode="read"] .board { display: none; }
.app[data-mode="read"] .speak { display: none; }
.app.read-typed[data-mode="read"] .speak { display: flex; } .app.read-typed .mic { display: none; }
.app[data-mode="read"] .cell { aspect-ratio: auto; grid-template-rows: auto auto; padding: 3px 0 4px; border-radius: 16px; }
.app[data-mode="read"] .pic { height: auto; aspect-ratio: 1; }
.app[data-mode="read"] .alabel { display: block; visibility: hidden; text-align: center; font-weight: 700; font-size: .85rem; margin-top: 3px; }
.app[data-mode="read"] .cell:has(.pic.done) .alabel { visibility: visible; }
.cell.hl { outline: 2px solid var(--teal); outline-offset: -2px; }
.app { gap: 10px; }
.app[data-mode="match"] .speak, .app[data-mode="listen"] .speak, .app[data-mode="write"] .speak { display: none; }
.listen .status { margin: 0 0 0 auto; font-size: 1.05rem; white-space: nowrap; }
.wbtns .btn { font-size: .82rem; padding: 0 6px; white-space: nowrap; min-height: 44px; }
header { display: none; }
.app[data-mode="listen"] .listen, .app[data-mode="match"] .listen { display: flex; } .app:not([data-mode="listen"]):not([data-mode="match"]) .listen { display: none; }
.app[data-mode="match"] #listenBtn, .app[data-mode="match"] #replayBtn { display: none; }
.alabel { display: none; }
.app.answers[data-mode="match"] .board { display: none; }   /* 정답보기에서는 아래 단어 줄을 숨기고 위의 그림(글)만 배열 순서대로 보인다 */
.app.answers .cell { aspect-ratio: auto; grid-template-rows: auto auto; padding: 3px 0 4px; border-radius: 16px; }
.app.answers .pic { height: auto; aspect-ratio: 1; }
.app.answers .alabel { display: block; text-align: center; font-weight: 700; font-size: .85rem; margin-top: 3px; }
.app.tr-on .word[data-tr]::after, .app.tr-on .alabel[data-tr]::after { content: attr(data-tr); display: block; font-size: .66rem; font-weight: 500; color: var(--muted); }
.cell.hl, .col.hl { background: color-mix(in srgb, var(--teal) 24%, transparent); border-radius: 16px; transition: background .15s; }
.cell.hl .alabel { color: var(--teal); }
.app.writing .pics, .app.writing .board, .app.writing .speak { display: none; }
.write { display: flex; flex-direction: column; gap: 12px; }
.write[hidden], .listen [hidden], .modes [hidden] { display: none !important; }
.wtop { display: flex; align-items: center; gap: 14px; }
.wpic { position: relative; width: 132px; height: 132px; display: grid; place-items: center; font-size: 5rem; line-height: 1; background: var(--card); border: 2px solid var(--line); border-radius: 22px; }
.wpic .o { inset: 6px; }
.wpic .x { font-size: 5rem; background: color-mix(in srgb, var(--card) 55%, transparent); border-radius: 20px; }
.padwrap { position: relative; box-sizing: border-box; background: #fff; border: 2px solid #8fa0aa; max-width: 100%; touch-action: none; }
.padgrid { position: absolute; inset: 0; display: grid; pointer-events: none; }
.gcell { flex: 1; box-sizing: border-box; border-right: 2px solid #8fa0aa;
  background:
    repeating-linear-gradient(to bottom, #b9c4cb 0 6px, transparent 6px 12px) center / 2px 100% no-repeat,
    repeating-linear-gradient(to right, #b9c4cb 0 6px, transparent 6px 12px) center / 100% 2px no-repeat; }
.gcell { display: flex; align-items: center; justify-content: center; color: #111; font-family: var(--body); font-weight: 500; line-height: 1; }
.gcell { border-bottom: 2px solid #8fa0aa; }
.gcell.lc { border-right: 0; }
.gcell.lr { border-bottom: 0; }
.wside { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-width: 0; }
.wside .btn { min-height: 40px; font-size: .8rem; padding: 0 4px; white-space: nowrap; }
#wMode { grid-column: 1 / -1; }
.gcell.ans { color: #e8553d; opacity: .75; }
.winput { font: inherit; font-size: 1.3rem; min-height: 52px; padding: 8px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--fg); width: 100%; box-sizing: border-box; }
.winput:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.write.typing .wpad { display: none; }
.write:not(.typing) .winput { display: none; }
.wbtns { flex-wrap: wrap; }
.wpad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; touch-action: none; }
.wbtns { display: flex; gap: 10px; }
.wbtns .btn { flex: 1; }
.actions { display: flex; justify-content: center; }
.btn { font: inherit; font-weight: 700; min-height: 48px; padding: 0 24px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: .9rem; }

@keyframes pop { 0% { transform: scale(.3) rotate(-12deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

/* 강의 연결: 쪽 넘기기, 정답 보기 상세 창 */
.pager { display: none; align-items: center; gap: 6px; font-size: .85rem; font-weight: 800; color: var(--muted); }
.pager.on { display: inline-flex; }
.wpic img.pimg, .ghost img.pimg { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; pointer-events: none; }
.wpic { overflow: hidden; }
.pic img.pimg { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; pointer-events: none; -webkit-user-drag: none; }
.app.answers .cell, .cell:has(.pic.done) { cursor: pointer; }
.detail { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 92%, #000); overflow-y: auto; display: flex; justify-content: center; }
.detail[hidden] { display: none; }
.dcard { width: min(560px, 100%); background: var(--card); color: var(--fg); min-height: 100%; position: relative; }
.dclose { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 1.2rem; cursor: pointer; z-index: 2; }
.dback { position: absolute; top: 8px; left: 8px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-weight: 800; cursor: pointer; z-index: 2; }
/* 단어 탭: 포털 「단어」 위젯과 같은 칩 모양(🔊 + 한국어 + 작은 영어 뜻) */
.wordsview { padding: 6px 2px 14px; }
.wordsview .wv-head { font-size: .8rem; color: var(--muted); font-weight: 700; margin: 2px 2px 8px; }
.wordsview .wv-grid { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.wordsview .wchip { position: relative; min-width: 0; max-width: 260px; min-height: 40px; border: 1.5px solid #80c88f; border-radius: 9px; background: var(--card); display: inline-grid; grid-template-columns: 28px minmax(0, max-content); align-items: center; gap: 4px; padding: 4px 10px 4px 5px; cursor: pointer; }
.wordsview .wchip:hover { background: color-mix(in srgb, #80c88f 14%, var(--card)); }
.wordsview .wspk { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; padding: 0; cursor: pointer; font-size: .85rem; }
.wordsview .wspk:hover { background: color-mix(in srgb, #80c88f 25%, transparent); }
.wordsview .wtx { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.wordsview .wtx strong { font-size: 1rem; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wordsview .wtx span { font-size: .72rem; line-height: 1.15; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app[data-mode="words"] .pics, .app[data-mode="words"] .board, .app[data-mode="words"] .speak, .app[data-mode="words"] .listen, .app[data-mode="words"] .vol { display: none; }
.dimg { background: #111827; aspect-ratio: 1; display: grid; place-items: center; position: relative; }
/* 처음 만든 그림이 아니라 다른 단어(원래 단어)의 그림을 빌려 쓰는 것: 점선 테두리 + ↗ 원래 단어 표시 */
.dimg.shared { outline: 3px dashed var(--teal); outline-offset: -5px; }
.dimg.shared::after, .pic.shared::after { content: "↗ " attr(data-from); position: absolute; left: 6px; top: 6px; z-index: 2; font-size: .62rem; font-weight: 800; line-height: 1; padding: 3px 7px; border-radius: 10px; background: var(--teal); color: var(--bg); pointer-events: none; }
.pic.shared { border-style: dashed; }
.dimg img { width: 100%; height: 100%; object-fit: contain; display: block; }
.dimg.none { aspect-ratio: 1; min-height: 0; background: var(--tray); color: var(--muted); font-weight: 700; }   /* 그림 없을 때도 그림과 같은 크기 자리 */
.noimg { font-size: .62rem; line-height: 1.35; font-weight: 700; color: var(--muted); text-align: center; pointer-events: none; }
.wpic .noimg, .ghost .noimg { font-size: .8rem; }
.dword { text-align: center; font-size: 1.5rem; font-weight: 800; padding: 10px 8px 2px; }
.dsub { text-align: center; color: var(--muted); font-size: .9rem; padding-bottom: 6px; }
/* 구분(순한글·한자어·외래어): 그림 아래, 단어 위. 이름 앞의 네모(ㅁ)에 해당 분류만 색을 채운다 */
.dgu { display: flex; justify-content: center; flex-wrap: nowrap; gap: 4px 10px; padding: 10px 6px 0; container-type: inline-size; }   /* 창을 넓히면 카드가 좁아지므로 창 너비가 아니라 카드 너비에 맞춰 한 줄 유지 */
.dgu span { display: inline-flex; align-items: center; gap: 5px; font-size: clamp(.6rem, calc(7.5cqw - 3px), .95rem); color: var(--muted); white-space: nowrap; }
.dgu span::before { content: ""; width: .9em; height: .9em; border: 2px solid var(--muted); border-radius: 3px; box-sizing: border-box; flex: 0 0 auto; }
.dgu span.on { color: var(--fg); font-weight: 800; }
.dgu span.on::before { background: var(--teal); border-color: var(--teal); }
.drow > span { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 1rem; }
.drow { display: grid; grid-template-columns: 50px minmax(0, .8fr) minmax(0, 1.6fr); }
.drow > span:first-child { white-space: nowrap; }
.han { color: #2563eb; font-weight: 800; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.dtok { padding: 10px 10px 2px; font-weight: 800; color: var(--muted); font-size: .85rem; }
.dnote { padding: 18px 12px; text-align: center; color: var(--muted); }
.dhead { padding: 52px 12px 6px; text-align: center; font-weight: 800; font-size: 1.1rem; }
.dlist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
.dchip { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); padding: 10px; text-align: left; cursor: pointer; font-size: 1rem; font-weight: 800; }
.dchip small { display: block; color: var(--muted); font-weight: 500; font-size: .75rem; margin-top: 2px; }
/* 활용 칸: 항상 3열, 글자는 칸 너비에 맞춰 줄어들고 줄바꿈하지 않는다 (동사 9칸 3x3, 형용사는 피동·사동 자리를 비움) */
.dforms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 6px 10px 10px; container-type: inline-size; }
.dforms div { border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px; text-align: left; font-weight: 800; font-size: clamp(.5rem, 3.8cqw, 1rem); min-height: 2.4em; white-space: normal; word-break: keep-all; overflow-wrap: break-word; overflow: hidden; line-height: 1.2; }   /* 칸이 좁으면 띄어쓰기 자리에서 줄바꿈(가리킬 / 거다). 한 낱말은 글자 중간에서 끊지 않는다 */
.dforms div small { display: block; color: var(--muted); font-weight: 500; font-size: clamp(.45rem, 3.2cqw, .72rem); white-space: nowrap; }
.dforms div.off { opacity: 1; }   /* 내용이 없는 칸도(유사어·반대어·파생어, 활용 칸 모두) 있을 때와 같은 밝기 */
.dforms.dsynbox { padding-top: 0; }
.dforms.dsynbox div small { white-space: normal; line-height: 1.15; }
.dforms .sl { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.dforms .sl:hover, .dforms .sl:focus-visible { color: var(--teal); text-decoration-style: solid; outline: none; }
.dpos { font-size: .55em; font-weight: 700; color: var(--muted); margin-right: .3em; vertical-align: middle; letter-spacing: 0; }
.dforms div.sp { border: 0; min-height: 0; }
.dforms div.nil, .dforms div.nil small { text-decoration: line-through; }   /* 형용사의 사동·피동 칸: 값이 없어서 – 에 취소선 */
.dforms div.hit { border: 2px solid #e11d48; box-shadow: 0 0 0 2px rgba(225,29,72,.18); }   /* 검색어와 같은 겸양·높임 낱말 */
.dforms.dhon { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dforms.dsynbox { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dforms.dvbox { padding-top: 0; }
.dforms.dcmpbox { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
.dforms.dcmpbox div small { white-space: normal; line-height: 1.15; }
.dforms.dvbox div small { white-space: normal; line-height: 1.15; }   /* 칸 제목(능동(원형) 등)이 잘리지 않고 줄바꿈 */
.dforms.dvbox div { white-space: normal; }
.acard .dforms:not(.dsynbox):not(.dvbox):not(.dcmpbox) { border-top: 1px solid var(--line); }
/* 폰(목록 카드가 좁을 때): 활용 칸 2열, 순서·자리는 그대로 */
@media (max-width: 560px) { .acard .dforms:not(.dsynbox):not(.dvbox):not(.dcmpbox) { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 6px 5px 8px; } .acard .dforms div { font-size: clamp(.5rem, 4.6cqw, 1rem); padding: 4px 3px; } .acard .dforms div small { font-size: clamp(.42rem, 3.6cqw, .72rem); } }
/* 정답 상세(칸 아래 펼침): 구분 + 음절 표 */
.idetail { position: relative; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 4px; }
.idetail[hidden] { display: none; }
.idetail .dword { padding-top: 14px; }
.idetail .dclose, .idetail .dback { top: 6px; }
.app.answers .col { cursor: pointer; }
/* 정답 목록: 이 쪽의 그림·단어를 3열로 아래로 죽 나열(12개 = 3열 x 4행) */
.alist-head { padding: 12px 12px 6px; font-weight: 800; color: var(--muted); font-size: .9rem; text-align: center; }
.agrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); container-type: inline-size; --cols: 3; }   /* 카드 안 글자·열 폭을 창이 아니라 카드 폭(목록 폭 ÷ 열 수)에 맞춘다 */
@media (max-width: 560px) { .agrid { grid-template-columns: repeat(2, minmax(0, 1fr)); --cols: 2; } }
@media (max-width: 340px) { .agrid { grid-template-columns: minmax(0, 1fr); --cols: 1; } }
.acard { border-top: 1px solid var(--line); border-left: 1px solid var(--line); scroll-margin-top: 8px; min-width: 0; }
.agrid .acard:nth-child(3n+1) { border-left: 0; }
@media (max-width: 560px) { .agrid .acard:nth-child(3n+1) { border-left: 1px solid var(--line); } .agrid .acard:nth-child(2n+1) { border-left: 0; } }
.acard.flash { animation: flashbg 1.2s ease; }
.pic.exact { border-color: var(--hit); box-shadow: 0 0 0 3px var(--hit); }
.alabel.exact, .word.exact { color: var(--hit); }
.acard.exact { outline: 4px solid var(--hit); outline-offset: -4px; border-radius: 14px; position: relative; z-index: 1; }   /* 검색어와 정확히 같은 단어 */
@keyframes flashbg { 0% { background: color-mix(in srgb, var(--teal) 25%, transparent); } 100% { background: transparent; } }
.agrid { grid-auto-flow: row; }
.acard { display: grid; grid-row: span var(--cardrows, 12); grid-template-rows: subgrid; row-gap: 0; }
.acard .dforms { width: 100%; box-sizing: border-box; }
.acard .dimg { aspect-ratio: 1; height: auto; }
.acard .dimg.none { aspect-ratio: 1; min-height: 0; height: auto; font-size: .8rem; }
.acard .dword { padding-top: 6px; font-size: 1.15rem; }

.dsent { display: block; border-top: 1px solid var(--line); text-align: left; }

.dsw:empty, .dsw:has(> span:empty) { display: none; }
.dsent .hl { color: #2563eb; font-weight: 800; }
/* 단어 | 번역 을 한 줄에: 세로 구분선으로 나누어 세로 공간을 아낀다 */
.dwt { display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; padding: 8px 8px; }
.dwt .dword { padding: 0 10px 0 0; font-size: 1.5rem; line-height: 1.2; flex: 0 0 auto; }
.dwt .dsub { padding: 0 0 0 10px; border-left: 2px solid var(--line); font-size: .95rem; line-height: 1.25; text-align: left; min-width: 0; flex: 0 1 auto; overflow-wrap: anywhere; }
.dwt .dword:only-child { padding-right: 0; }
.acard .dwt { padding: 6px 4px; }
.acard .dwt .dword { padding: 0 8px 0 0; font-size: 1.15rem; }
.acard .dwt .dsub { padding-left: 8px; font-size: .8rem; }
.acard .dwt .dword:only-child { padding-right: 0; }
.dwt .dword.long { font-size: 1.15rem; }
.acard .dwt .dword.long { font-size: .95rem; }
.acard .dwt, .acard .ddet, .acard .dforms.dsynbox, .acard .dforms.dvbox, .acard .dforms.dcmpbox { border-top: 1px solid var(--line); }
.acard .dtab { display: contents; }
.acard .dtab > .drow:first-child { border-top: 1px solid var(--line); }
.acard .drow.ph { border: 0; padding: 0; min-height: 0; }
.acard .drow { align-self: stretch; }   /* 한 카드의 줄이 두 줄이면 옆 카드의 같은 줄도 같은 높이로 늘려 선을 맞춘다 */
.acard { align-items: start; }
.dsent.empty { display: none; }
.acard .dtop, .acard .dsent, .acard .dsent.empty { display: contents; }
.acard .dsk, .acard .dse { min-height: 1.6em; }
.acard .dse { display: block !important; }
.acard .dsw { display: block !important; min-height: 1.4em; }
.acard .dwt { border-bottom: 1px solid var(--line); }
.acard .dsent { border-top: 0; }
.acard .drow > span + span { border-left: 1px solid var(--line); }
.acard .dforms.dsynbox, .acard .dforms.dvbox, .acard .dforms.dcmpbox { margin-top: 0; padding-top: 6px; }
.acard .dsk { font-size: clamp(8.5px, calc(4.6cqw / var(--cols, 3)), 14px); padding: 4px 5px; }   /* 예문 글자도 카드 폭에 비례해 줄어든다 */
.acard .dse { font-size: clamp(8px, calc(4.2cqw / var(--cols, 3)), 12.5px); padding: 4px 5px; }
.acard .drow > span { padding: 5px 3px; font-size: clamp(8.5px, calc(5cqw / var(--cols, 3)), 12.5px); overflow-wrap: break-word; }
.acard .drow { grid-template-columns: clamp(28px, calc(16cqw / var(--cols, 3)), 42px) minmax(0, .8fr) minmax(0, 1.35fr); }
.acard .drow > span:nth-child(-n+2) { overflow-wrap: anywhere; word-break: keep-all; }
.acard .drow > span:first-child { white-space: nowrap; overflow-wrap: normal; }

.drow.rs-top > span:nth-child(3) { position: relative; overflow: visible; }

/* PC 포털 위젯 안: 메뉴는 위젯 헤더로 올라가므로 이 안의 버튼 줄은 숨긴다(모바일 앱·별도 창은 그대로) */
.app.hosted .modes > .btn, .app.hosted .pager { display: none !important; }

/* 전체 단어 검색(강의·영상에 속하지 않을 때: 홈·강의실) */
.sbar { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }   /* 무조건 한 줄: 검색칸만 줄고 버튼 자리는 고정 */

/* 시크릿 모드(상단 시크릿 버튼): 단어 그림을 가린다. 글자는 그대로 */

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 단어 배열 순서: 내용순(영상·교재에 나온 순서) / ㄱㄴㄷ순. 짝짓기·읽기·쓰기 시험은 그대로 섞인다. */

/* 글자 정렬(모든 화면): 그림 밑 글자는 위쪽 기준, 아래 단어 줄은 왼쪽 정렬·20% 축소·길면 두 줄 */
/* 그림 밑 글자(한글·뜻): 위쪽 기준으로 맞추고, 길면 두 줄로 줄바꿈 */

.app.answers .alabel { min-height: 2.5em; }

@media (max-width: 560px) { .app.answers .alabel[data-tr]::after { font-size: .6rem; } .app.answers .word[data-tr]::after { font-size: .53rem; line-height: 1.15; } }

/* ===== 검색줄·읽기 강조 (모든 화면) ===== */
/* 검색줄: 입력창을 줄여 순한글·한자어·외래어·그림만을 한 줄에 */

      var render = function () { return head + (ws.length ? '<div class="agrid">' + ws.map(function (x) { return '<section class="acard" data-w="' + esc(x.word) + '">' + wordView(x.word, true) + "</section>"; }).join("") + "</div>" : '<div class="dnote">찾은 단어가 없습니다.</div>'); };
      paint(render());
      imgs(ws.map(function (x) { return x.word; })).then(function () { var top = trail[trail.length - 1]; if (isOpen() && top && top.t === "h" && top.v === ch) paint(render()); });
    }).catch(function () { paint('<div class="dhead">검색하지 못했습니다.</div>'); });
  }
  function isOpen() { return inl ? !inlineEl.hidden : !detailEl.hidden; }
  function closeDetail() { detailEl.hidden = true; inlineEl.hidden = true; trail = []; }
  function onDetailClick(e) {
    var t = e.target, sl = t.closest && t.closest(".sl[data-q]"), han = t.closest && t.closest(".han[data-han]"), chip = t.closest && t.closest(".dchip"), back = t.closest && t.closest(".dback");
    if (sl) { searchFor(sl.dataset.q); return; }
    if (han) { showHan(han.dataset.han); return; }
    if (chip) { var cw = chip.dataset.w; trail.push({ t: "w", v: cw }); paint(wordView(cw)); imgs([cw]).then(function () { if (isOpen()) paint(wordView(cw)); }); return; }
    if (back) { trail.pop(); var top = trail[trail.length - 1]; if (top && top.t === "list") { showList(); return; } if (top && top.t === "w") paint(wordView(top.v)); else if (top && top.t === "h") { trail.pop(); showHan(top.v); } else closeDetail(); return; }
    if (t.closest(".dclose") || t === detailEl) closeDetail();
  }
  detailEl.addEventListener("click", onDetailClick);
  inlineEl.addEventListener("click", onDetailClick);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen()) closeDetail(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && e.target.classList && e.target.classList.contains("sl")) searchFor(e.target.dataset.q); });
  boardEl.addEventListener("click", function (e) {
    var col = e.target.closest && e.target.closest(".col"); if (!col) return;
    if (appEl.classList.contains("answers") || col.classList.contains("done")) openCard(col.dataset.w);
  });
  picsEl.addEventListener("click", function (e) {
    var cell = e.target.closest && e.target.closest(".cell"); if (!cell) return;
    var pic = cell.querySelector(".pic");
    if (pic && (appEl.classList.contains("answers") || pic.classList.contains("done"))) openCard(pic.dataset.w);
  });

  /* 시크릿 모드: 포털 상단 「시크릿」 버튼이 보내는 신호를 받아 그림을 숨긴다 */
  function applySecret(on) { document.body.classList.toggle("korlec-secret", !!on); }
  window.addEventListener("message", function (e) { var d = e.data || {}; if (d.type === "korlec-secret-mode") applySecret(d.on); });
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: "korlec-request-secret-mode" }, "*"); } catch (e) {}

  /* PC 포털 위젯 안이면 메뉴를 위젯 헤더에 올린다: 포털이 host 신호를 보내면 상태를 알려 주고 명령을 받는다 */
  var PREV_MODE = "";
  var hosted = false, lastBar = "";
  function barState() {
    paintOrder();
    return { mode: appEl.dataset.mode || "match", tr: trOn(), ans: appEl.classList.contains("answers"), ansVis: !ansBtn.hidden, allVis: !allBtn.hidden, allOn: allBtn.dataset.on === "1", fmVis: !fmBtn.hidden, fm: showForms,
      ord: ORDER, ordLabel: ordLabel(), allview: ALLVIEW, pages: browse ? bPages : (ALL ? sizes(ALL.length).length : 1), page: (browse ? bPage : curPage) + 1 };
  }
  function sendBar() {
    if (!hosted) return;
    var st = barState(), js = JSON.stringify(st);
    if (js === lastBar) return; lastBar = js;
    try { window.parent.postMessage({ type: "korlec-wordgame-bar", state: st }, "*"); } catch (e) {}
  }
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (e.source !== window.parent) return;
    if (d.type === "korlec-wordgame-host" && d.toolbar === "header") { hosted = true; appEl.classList.add("hosted"); document.body.classList.add("hosted-body"); lastBar = ""; sendBar(); setInterval(sendBar, 300); return; }
    if (d.type !== "korlec-wordgame-cmd") return;
    var c = String(d.cmd || ""), btn = null;
    if (c.indexOf("mode:") === 0) btn = document.querySelector('.mode[data-mode="' + c.slice(5) + '"]');
    else if (c.indexOf("ord:") === 0) btn = ordbarEl.querySelector('.chip[data-ord="' + c.slice(4) + '"]');
    else if (c === "tr") btn = document.getElementById("trBtn");
    else if (c === "ans") btn = ansBtn; else if (c === "all") btn = allBtn; else if (c === "fm") btn = fmBtn;
    else if (c === "allview") { if (ALL && !browse) { ALLVIEW = !ALLVIEW; if ((appEl.dataset.mode || "match") === "words") setMode(PREV_MODE || "match"); showPage(0); } setTimeout(sendBar, 50); return; }
    else if (c === "textview") { var cur = appEl.dataset.mode || "match"; if (cur === "words") setMode(PREV_MODE || "match"); else { PREV_MODE = cur; setMode("words"); } setTimeout(sendBar, 50); return; }   /* 글자만 보기: 한 번 더 누르면 원래 모드로 */
    else if (c === "prev") btn = document.getElementById("pgPrev"); else if (c === "next") btn = document.getElementById("pgNext");
    if (btn) btn.click();
    setTimeout(sendBar, 50);
  });

  start();
})();
</script>

</body></html>
